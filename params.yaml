
# Configuration globale du projet
project:
  name: ecommerce-rag-assistant
  domain: jumia-maroc
  random_state: 42

# Configuration de l'ingestion
ingestion:
  source_dir: data/raw
  processed_dir: data/processed
  supported_extensions:
    - .pdf
    - .txt
    - .html

# Configuration du chunking
chunking:
  chunk_size: 300
  chunk_overlap: 50

# Configuration des embeddings
embeddings:
  provider: sentence-transformers
  model_name: sentence-transformers/all-MiniLM-L6-v2

# Configuration de ChromaDB
vector_store:
  provider: chromadb
  persist_directory: indexes/chroma_ecommerce
  collection_name: jumia_documents

# Configuration du Retrieval
retrieval:
  top_k: 3

# Configuration du LLM
llm:
  provider: ollama
  model_name: llama3.2:latest
  temperature: 0.1
  max_tokens: 512
  base_url: http://localhost:11434

# Configuration de l'évaluation
evaluation:
  questions_file: data/evaluation/questions.yaml
  metrics:
    - recall_at_k
    - precision_at_k
    - faithfulness
    - answer_relevance
    - citation_rate
    - latency
# Configuration des Quality Gates
quality_gate:
  min_recall_at_5: 1.00
  min_precision_at_5: 0.25
  min_mrr: 0.75
  min_evaluated_questions: 3
  require_out_of_scope_case: true